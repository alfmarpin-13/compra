<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Compra</title>
<meta name="description" content="La lista de la compra de casa, compartida en tiempo real.">
<meta name="theme-color" content="#F3F4EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Compra">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preload" href="fonts/figtree-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/figtree-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
<script>
  // Tema antes de pintar, para que no parpadee.
  (function () {
    try {
      var t = localStorage.getItem("compra.theme") || "system";
      var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      if (dark) document.querySelector('meta[name="theme-color"]').content = "#0E1511";
      if (navigator.standalone) document.documentElement.classList.add("standalone");
    } catch (e) {}
  })();
</script>
<link rel="modulepreload" href="js/app.js">
</head>
<body>
<div class="topband" aria-hidden="true"></div>
<main class="app" id="root" aria-live="off"></main>
<noscript><p style="padding:24px;font-family:system-ui">Compra necesita JavaScript.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
