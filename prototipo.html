<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#583D53">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Compra</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2222%22%20fill%3D%22%23D9F56E%22/%3E%3Cpath%20d%3D%22M27%2050C27%2021%2073%2021%2073%2050%22%20fill%3D%22none%22%20stroke%3D%22%231C3A2D%22%20stroke-width%3D%227%22%20stroke-linecap%3D%22round%22/%3E%0A%3Cpath%20d%3D%22M21%2057H79L72.5%2082.5Q71.4%2087%2066.8%2087H33.2Q28.6%2087%2027.5%2082.5Z%22%20fill%3D%22%231C3A2D%22/%3E%0A%3Cg%20stroke%3D%22%23D9F56E%22%20stroke-width%3D%222.6%22%20stroke-linecap%3D%22round%22%20fill%3D%22none%22%3E%3Cpath%20d%3D%22M24%2066.5H76M26.3%2076.5H73.7%22/%3E%3Cpath%20d%3D%22M33%2059.5%2034.6%2084.5M44.3%2059.5%2045%2084.5M55.7%2059.5%2055%2084.5M67%2059.5%2065.4%2084.5%22/%3E%3C/g%3E%0A%3Crect%20x%3D%2215%22%20y%3D%2246%22%20width%3D%2270%22%20height%3D%2211%22%20rx%3D%225.5%22%20fill%3D%22%231C3A2D%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- Paletas: valores exactos de Usuals (Palettes.kt / Color.kt / theme.css) ---------- */
:root{
  --ground:#F8F5EF;--paper:#FFFDFA;--ink:#302331;--muted:#6E5E6B;--primary:#583D53;--on-primary:#FFFDFA;
  --tint:#EEDFE8;--on-tint:#50364B;--champagne:#EFE1CA;--gold:#664D2D;--leaf:#E2E6DB;--on-leaf:#46533B;
  --outline:#887887;--line:#E3D9DD;--pressed:#F0EAE7;--danger:#A72F48;--danger-c:#FFDDE5;
  --desk:#E9E3DA;--sec-mix:84%;
  --sat:54px;--sab:24px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --ground:#1D181E;--paper:#28212A;--ink:#F5EDF1;--muted:#C6B6C1;--primary:#E2BCD4;--on-primary:#1D181E;
  --tint:#4B3548;--on-tint:#F5EDF1;--champagne:#453929;--gold:#EDDBBA;--leaf:#343E2F;--on-leaf:#D0DFBF;
  --outline:#AA96A5;--line:#4C3E4A;--pressed:#352C35;--danger:#FFB3C3;--danger-c:#5C2236;
  --desk:#0E0B0F;--sec-mix:55%;color-scheme:dark;
}
:root[data-palette="grove"]{
  --ground:#F3F5ED;--paper:#FCFDF8;--ink:#243428;--muted:#53644F;--primary:#36593F;--on-primary:#FCFDF8;
  --tint:#DEE8D6;--on-tint:#29452F;--champagne:#EDE1CA;--gold:#624C2D;--leaf:#E2E9DC;--on-leaf:#455D3A;
  --outline:#75806E;--line:#D8E0D1;--pressed:#E8EDE1;--desk:#E1E6DA;
}
:root[data-palette="grove"][data-theme="dark"]{
  --ground:#171F19;--paper:#222D24;--ink:#EDF3E8;--muted:#BDCCB7;--primary:#BCD5AA;--on-primary:#171F19;
  --tint:#354A35;--on-tint:#EDF3E8;--champagne:#443B29;--gold:#EDDDBD;--leaf:#344232;--on-leaf:#C9DDBE;
  --outline:#94A48C;--line:#414F3D;--pressed:#2C392E;--desk:#0B100C;
}
:root[data-palette="tide"]{
  --ground:#EFF5F7;--paper:#FBFDFE;--ink:#233640;--muted:#526872;--primary:#285D70;--on-primary:#FBFDFE;
  --tint:#D7EAF0;--on-tint:#214E61;--champagne:#DBEAE3;--gold:#345D4C;--leaf:#F0E2CD;--on-leaf:#624C2E;
  --outline:#728791;--line:#D3E1E7;--pressed:#E4EEF2;--desk:#DCE6EA;
}
:root[data-palette="tide"][data-theme="dark"]{
  --ground:#151F27;--paper:#202D37;--ink:#ECF3F7;--muted:#BACDD8;--primary:#A7D6E5;--on-primary:#151F27;
  --tint:#294754;--on-tint:#EBF5F9;--champagne:#2C443E;--gold:#C3E1D2;--leaf:#473D2D;--on-leaf:#EFDEC0;
  --outline:#90A7B4;--line:#40515D;--pressed:#2A3944;--desk:#0A1015;
}
:root.real-device{--sat:env(safe-area-inset-top);--sab:max(env(safe-area-inset-bottom),8px)}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--fb);background:var(--desk);color:var(--ink);-webkit-font-smoothing:antialiased;font-synthesis:none;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
input{font:inherit;color:inherit}
.icon{display:block;flex-shrink:0}
.serif{font-family:var(--fh);font-weight:400}

/* ---------- Teléfono ---------- */
.phone{position:relative;width:100%;max-width:440px;height:100dvh;margin:0 auto;overflow:hidden;background:var(--ground);isolation:isolate}
@media (min-width:520px) and (min-height:900px){
  body{display:grid;place-items:center}
  .phone{width:402px;height:874px;border-radius:54px;box-shadow:0 0 0 11px #121013,0 0 0 12px #3a3540,0 40px 90px rgba(0,0,0,.35)}
}
.sbar{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 40px;font:600 16px/1 var(--fb);z-index:80;pointer-events:none;color:var(--ink)}
.sbar .island{position:absolute;left:50%;top:11px;width:124px;height:36px;border-radius:20px;background:#000;transform:translateX(-50%)}
.sbar .sys{display:flex;gap:6px;align-items:center}
.hind{position:absolute;bottom:8px;left:50%;width:136px;height:5px;border-radius:3px;background:var(--ink);transform:translateX(-50%);z-index:90;pointer-events:none}
.real-device .sbar,.real-device .hind{display:none}

.scr{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:var(--sat);padding-bottom:var(--sab)}
.scr > *{position:relative;z-index:1}

/* ---------- Ilustración en capas (BrandCollage / BrandBackdrop) ---------- */
.collage svg{width:100%;height:100%;display:block;overflow:visible}
.collage .c-sec{fill:color-mix(in srgb,color-mix(in srgb,var(--champagne) var(--sec-mix),var(--gold)) 78%,var(--paper))}
.collage .c-ter{fill:color-mix(in srgb,color-mix(in srgb,var(--leaf) 65%,var(--on-leaf)) 78%,var(--paper))}
.collage .c-pap{fill:var(--paper)}
.collage .c-pri{fill:color-mix(in srgb,var(--primary) 78%,var(--paper))}
.ambient{position:absolute!important;inset:0;z-index:0!important;overflow:hidden;pointer-events:none;
  -webkit-mask-image:linear-gradient(90deg,transparent 35%,#000 82%);mask-image:linear-gradient(90deg,transparent 35%,#000 82%)}
.ambient .collage{position:absolute;width:460px;height:320px;top:calc(var(--sat) + 65px);right:-100px;transform:rotate(-104deg) scale(2.1);opacity:.22}
.ambient.compact .collage{top:calc(var(--sat) - 110px);transform:rotate(-104deg) scale(1.4);opacity:.12}
:root[data-bg="plain"] .ambient,:root[data-bg="plain"] .lh .collage{display:none}
:root[data-bg="artwork"] .backed{background:var(--ground);border-radius:4px;padding:0 3px;margin-left:-3px}

/* ---------- Cabecera de lista (ListHeaderBar) ---------- */
.lh{margin:4px 12px;border-radius:20px;position:relative}
.lh .collage{position:absolute;right:-34px;top:50%;width:260px;height:181px;transform:translateY(calc(-50% - 8px));opacity:.24;pointer-events:none;-webkit-mask-image:radial-gradient(closest-side,#000 45%,transparent);mask-image:radial-gradient(closest-side,#000 45%,transparent)}
.lh.compact .collage{width:210px;height:146px}
.lh-in{position:relative;display:flex;align-items:flex-start;min-height:80px;padding:6px 12px}
.lh.compact .lh-in{min-height:72px;padding:2px 12px}
.lh-t{flex:1;min-width:0}
.ltitle{display:inline-flex;align-items:center;gap:4px;color:var(--primary);font:400 34px/42px var(--fh);letter-spacing:-.5px}
.lh.compact .ltitle{font:600 22px/30px var(--fb);letter-spacing:-.3px}
.ltitle .icon{color:var(--ink)}
.lcount{font:400 12px/18px var(--fb);color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.lcount .dot{width:6px;height:6px;border-radius:50%;background:var(--primary);opacity:.8}
.ib{width:48px;height:48px;border-radius:50%;background:var(--paper);color:var(--primary);display:grid;place-items:center;flex:none}
.ib-row{display:flex;gap:2px}

.barrow{display:flex;justify-content:space-between;align-items:center;padding:0 20px;min-height:48px}
.barrow .lab{font:600 14px/20px var(--fb)}
.rule{height:1px;background:var(--line);margin:4px 20px 2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 20px 8px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.chips::-webkit-scrollbar{display:none}
.chip{height:32px;border-radius:8px;padding:0 14px;border:1px solid var(--outline);color:var(--ink);font:500 14px/20px var(--fb);display:inline-flex;align-items:center;gap:7px;white-space:nowrap;flex:none;background:var(--ground)}
.sheet .chip{background:transparent}
.chip.on,.sheet .chip.on{background:var(--champagne);color:var(--gold);border-color:var(--champagne)}
.chip .n{font:600 12px/1 var(--fb);color:var(--muted)}
.chip.on .n{color:var(--gold);opacity:.8}
.chip.sm{height:30px;padding:0 12px;font-size:13px}

/* ranura neutra para el logotipo de la tienda (sin marcas) */
.slot{width:16px;height:16px;border-radius:5px;display:inline-grid;place-items:center;flex:none;background:color-mix(in srgb,var(--primary) 11%,transparent);color:var(--primary)}
.slot.lg{width:28px;height:28px;border-radius:8px}
.slot.store{background:transparent;border:1px dashed color-mix(in srgb,var(--outline) 80%,transparent);color:var(--muted)}

/* ---------- Lista ---------- */
.list{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 0 18px;overscroll-behavior:contain;scrollbar-width:none}
.list::-webkit-scrollbar{display:none}
.cath{display:flex;align-items:center;gap:10px;padding:14px 28px 8px 24px}
.cico{--cat:var(--cl);width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--cat);background:color-mix(in srgb,var(--cat) 8%,transparent);flex:none}
:root[data-theme="dark"] .cico{--cat:var(--cd)}
.cath .catl{flex:1;font:600 14px/20px var(--fb)}
.cnt{font:600 12px/18px var(--fb);color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,var(--paper));border-radius:12px;padding:3px 9px}
.group{margin:0 20px;background:var(--paper);border-radius:16px;overflow:hidden}
.row{position:relative;display:flex;align-items:center;min-height:56px;padding:10px 18px;cursor:pointer;user-select:none;-webkit-user-select:none;transition:background .4s}
.row + .row::before{content:"";position:absolute;top:0;left:58px;right:16px;height:1px;background:var(--line)}
.row.fresh{background:color-mix(in srgb,var(--primary) 9%,var(--paper))}
.ck{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--outline);background:var(--paper);margin-right:14px;flex:none;display:grid;place-items:center;color:var(--on-primary)}
.row.done .ck{background:var(--primary);border-color:var(--primary)}
.rinfo{flex:1;min-width:0}
.nm{font:500 16px/24px var(--fb);color:var(--ink);overflow-wrap:anywhere}
.row.done .nm{text-decoration:line-through;color:var(--muted)}
.st{display:flex;align-items:center;gap:5px;font:600 11px/16px var(--fb);letter-spacing:.3px;color:var(--muted);margin-top:1px}
.st .by{font-weight:500;letter-spacing:0}
.qty{flex:none;margin-left:12px;font:600 12px/18px var(--fb);color:var(--muted);background:var(--ground);border-radius:6px;padding:5px 9px;white-space:nowrap}
.shopping .row{min-height:84px}
.shopping .nm{font:600 22px/30px var(--fb);letter-spacing:-.3px}
.chkdiv{display:flex;align-items:center;gap:12px;padding:16px 20px;cursor:pointer}
.chkdiv i{display:block;height:1px;background:var(--line);width:28px}
.chkdiv i:last-child{flex:1}
.chkdiv span{font:600 12px/18px var(--fb);color:var(--muted)}
.finish{padding:0 20px}
.finish p{font:400 14px/21px var(--fb);color:var(--ink)}
.finish .tbtn{width:100%;justify-content:flex-start;padding:0 12px;margin:4px -12px 0;min-height:48px}
.partial{font:500 16px/24px var(--fb);color:var(--primary);padding:9px 20px}
.partial .caret{display:inline-block;width:2px;height:18px;background:var(--primary);vertical-align:-3px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px}
.empty .collage{width:240px;height:156px;margin-bottom:16px}
.empty h2{font:400 26px/34px var(--fh);letter-spacing:-.3px;margin-bottom:8px}
.empty p{font:400 14px/21px var(--fb);color:var(--muted)}
.storeempty{font:400 14px/21px var(--fb);color:var(--ink);padding:20px}

/* ---------- Banda de captura (CaptureBand) ---------- */
.dock{margin:10px 16px 10px;padding:10px;background:var(--paper);border:1px solid var(--line);border-radius:22px;display:flex;gap:10px;align-items:center;position:relative;z-index:6}
.dk-add,.dk-voice{min-height:52px;border-radius:14px;display:flex;align-items:center;gap:6px;padding:8px 12px;font:600 14px/20px var(--fb);text-align:left}
.dk-add{flex:1;background:var(--pressed);color:var(--muted)}
.dk-voice{flex:1.3;background:var(--primary);color:var(--on-primary);touch-action:none}
.dk-voice.on .mic{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.22)}}
.dk-side{width:48px;height:48px;border-radius:50%;background:var(--champagne);color:var(--gold);display:grid;place-items:center;flex:none}
.draft{flex:1;min-width:0}
.draft .from{font:600 11px/16px var(--fb);letter-spacing:.3px;color:var(--muted);margin:0 0 6px}
.draft .sug{display:flex;gap:8px;overflow-x:auto;margin-bottom:8px;scrollbar-width:none}
.draft .sug::-webkit-scrollbar{display:none}
.draft .line{display:flex;align-items:center;min-height:44px}
.draft input{flex:1;min-width:0;border:0;outline:none;background:none;font:500 16px/24px var(--fb);color:var(--ink)}
.draft input::placeholder{color:var(--muted);opacity:1}
.tbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 12px;border-radius:20px;color:var(--primary);font:600 14px/20px var(--fb)}
.tbtn:disabled{opacity:.38;cursor:default}
.tbtn.danger{color:var(--danger)}
.finishbar{background:var(--paper);padding:10px 20px 8px;position:relative;z-index:6;border-top:1px solid var(--line)}
.finishbar p{font:400 12px/18px var(--fb);color:var(--ink);margin-bottom:8px}
.fb-row{display:flex;gap:10px;align-items:center}.fb-row .btn{flex:1}
.dk-voice-mini.on .mic{animation:pulse 1.1s ease-in-out infinite}
.catcher{position:absolute;inset:0;z-index:5!important}

/* banda de aviso (ShopCompletion) */
.band{background:var(--champagne);color:var(--ink);padding:14px 12px 6px 20px;position:relative;z-index:6;animation:fade .25s}
.band .top{display:flex;align-items:flex-start;gap:8px}
.band .msg{flex:1;font:500 16px/24px var(--fb);padding-top:6px}
.band .acts{display:flex;gap:4px;margin-left:-12px}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}

/* ---------- Botones M3 de Usuals ---------- */
.btn{min-height:48px;border-radius:24px;padding:0 24px;font:600 14px/20px var(--fb);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.fill{background:var(--primary);color:var(--on-primary)}
.btn.out{border:1px solid var(--outline);color:var(--primary)}
.btn.tall{min-height:52px}
.btn:disabled{opacity:.4}
.btns{display:flex;gap:12px}
.btns .btn{flex:1}

/* ---------- Hojas inferiores (ModalBottomSheet) ---------- */
.scrim{position:absolute;inset:0;background:color-mix(in srgb,var(--ink) 32%,transparent);z-index:60;animation:fadein .2s}
:root[data-theme="dark"] .scrim{background:rgba(0,0,0,.55)}
@keyframes fadein{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;background:var(--paper);border-radius:28px 28px 0 0;z-index:61;display:flex;flex-direction:column;padding-bottom:calc(var(--sab) + 8px);animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40%);opacity:.4}}
.handle{width:32px;height:4px;border-radius:2px;background:var(--muted);opacity:.5;margin:22px auto 14px;flex:none}
.sbody{overflow-y:auto;padding:0 24px 8px;display:flex;flex-direction:column;gap:18px;scrollbar-width:none}
.sbody::-webkit-scrollbar{display:none}
.sfoot{padding:12px 24px 0;display:flex;gap:12px}
.sfoot .btn{flex:1}
.shead{display:flex;align-items:center;gap:8px}
.shead h2{flex:1;font:600 22px/30px var(--fb);letter-spacing:-.3px}
.shead h2.serif{font:400 26px/34px var(--fh);letter-spacing:-.3px}
.help{font:400 14px/21px var(--fb);color:var(--muted)}
.said{font:400 14px/21px var(--fb);color:var(--muted)}
.said q{color:var(--ink);quotes:"«" "»"}
.card{background:var(--paper);border:1px solid var(--line);border-radius:20px}
.prow{display:flex;gap:12px;padding:14px 16px;position:relative;align-items:flex-start}
.prow + .prow{border-top:1px solid var(--line)}
.prow .cico{margin-top:2px}
.prow .pmain{flex:1;min-width:0}
.prow .pname{font:500 16px/24px var(--fb);display:flex;gap:8px;align-items:baseline}
.prow .pmeta{font:400 12px/18px var(--fb);color:var(--muted)}
.prow .note{font:500 13px/19px var(--fb);color:var(--ink);margin-top:8px}
.prow .opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.prow.off .pname,.prow.off .pmeta{opacity:.45}
.prow .qty{margin-left:0}
.mini-ck{width:20px;height:20px;border-radius:4px;border:2px solid var(--outline);display:grid;place-items:center;flex:none;color:var(--on-primary);margin-top:2px}
.mini-ck.on{background:var(--primary);border-color:var(--primary)}
.labelsm{font:600 12px/18px var(--fb);color:var(--muted)}
.big-name{font:400 30px/38px var(--fh);letter-spacing:-.5px}

/* menú desplegable */
.menu{position:absolute;right:16px;top:calc(var(--sat) + 62px);min-width:232px;background:var(--paper);border-radius:6px;padding:8px 0;z-index:71;box-shadow:0 3px 8px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.14);animation:fadein .15s}
:root[data-theme="dark"] .menu{background:color-mix(in srgb,var(--paper) 88%,var(--ink));box-shadow:0 8px 24px rgba(0,0,0,.5)}
.menu button{display:flex;width:100%;align-items:center;gap:12px;min-height:48px;padding:0 16px;font:500 15px/20px var(--fb);text-align:left}
.menu button .icon{color:var(--muted)}
.menu hr{border:0;height:1px;background:var(--line);margin:8px 0}
.mscrim{position:absolute;inset:0;z-index:70}

/* ---------- Pantallas secundarias (Historial / Habituales) ---------- */
.topbar{display:flex;align-items:center;gap:4px;min-height:64px;padding:0 4px 0 4px;background:var(--paper);margin-top:calc(-1 * var(--sat));padding-top:var(--sat);box-sizing:content-box}
.topbar h1{flex:1;font:400 26px/34px var(--fh);letter-spacing:-.3px;margin-left:8px}
.topbar .ibb{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.pad{padding:12px 20px 24px;flex:1;overflow-y:auto;scrollbar-width:none}
.pad::-webkit-scrollbar{display:none}
.field{position:relative;border:1px solid var(--outline);border-radius:6px;min-height:56px;display:flex;align-items:center;gap:10px;padding:0 16px;background:transparent}
.field:focus-within{border:2px solid var(--primary);padding:0 15px}
.field input{flex:1;min-width:0;border:0;outline:none;background:none;font:500 16px/24px var(--fb);color:var(--ink)}
.field input::placeholder{color:var(--muted);opacity:1}
.field label{position:absolute;top:-9px;left:12px;padding:0 4px;background:var(--ground);font:400 12px/16px var(--fb);color:var(--muted)}
.sheet .field label{background:var(--paper)}
.field .icon{color:var(--muted)}
.prow.tap{cursor:pointer}
.trip{border:1px solid var(--line);border-radius:20px;padding:20px 20px 12px;margin-top:16px;background:color-mix(in srgb,var(--paper) 60%,transparent)}
.trip h3{font:600 17px/24px var(--fb);letter-spacing:-.15px}
.trip .tsub{font:600 12px/18px var(--fb);color:var(--primary);margin-top:2px}
.trip .titem{display:flex;align-items:center;gap:16px;min-height:52px;font:500 16px/24px var(--fb);cursor:pointer;padding-left:12px}
.trip .tbtn{margin-left:0}
.secth{font:600 17px/24px var(--fb);letter-spacing:-.15px;margin:22px 4px 10px}
.secth small{display:block;font:400 12px/18px var(--fb);color:var(--muted);letter-spacing:0}
.due{font:600 11px/16px var(--fb);color:var(--gold);background:var(--champagne);border-radius:6px;padding:3px 8px;white-space:nowrap;flex:none;align-self:center}
.bottombtn{padding:12px 20px 4px;background:var(--ground)}
.bottombtn .btn{width:100%}

/* ---------- Acceso ---------- */
.login{flex:1;overflow-y:auto;padding:0 28px 12px;display:flex;flex-direction:column}
.login .art{height:220px;margin:6px -28px 0;position:relative}
.login .art .collage{position:absolute;left:50%;top:0;width:330px;height:230px;transform:translateX(-46%)}
.login .art .collage .c-sec{fill:color-mix(in srgb,var(--champagne) var(--sec-mix),var(--gold))}
.login .art .collage .c-ter{fill:color-mix(in srgb,var(--leaf) 65%,var(--on-leaf))}
.login .art .collage .c-pri{fill:var(--primary)}
.wordmark{display:flex;align-items:center;gap:12px;font:400 37px/1 var(--fh);letter-spacing:-1.8px;margin-top:6px}
.wordmark .dotc{color:var(--primary)}
.login h1{font:400 30px/38px var(--fh);letter-spacing:-.7px;margin:22px 0 10px}
.login .lede{font:400 15px/1.65 var(--fb);color:var(--muted)}
.login form{display:flex;flex-direction:column;gap:20px;margin-top:26px}
.login .err{font:500 14px/1.5 var(--fb);color:var(--danger)}
.login .note{display:flex;gap:8px;align-items:center;font:400 12px/18px var(--fb);color:var(--muted);margin-top:18px}
.login .note .sd{width:7px;height:7px;border-radius:50%;background:var(--primary)}
.remember{display:flex;align-items:center;gap:12px;font:500 14px/20px var(--fb);cursor:pointer}


/* ---------- Cabecera compacta ---------- */
.hb{display:flex;align-items:center;gap:8px;padding:4px 12px 0 20px;min-height:52px}
.hb-t{flex:1;min-width:0;display:flex;flex-direction:column}
.hb-t .lcount{margin-top:-2px}
.hb-name{font:400 26px/32px var(--fh);color:var(--primary);letter-spacing:-.4px}
.hb-r{display:flex;gap:4px}
.ib.sm{width:40px;height:40px}
/* ---------- Casillas (estilo KitchenOwl) ---------- */
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 20px}
.tile{position:relative;aspect-ratio:1/.88;background:var(--paper);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 6px 6px;text-align:center;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:background .4s,transform .12s}
.tile:active{transform:scale(.96)}
.tile.fresh{background:color-mix(in srgb,var(--primary) 12%,var(--paper))}
.tic{--cat:var(--cl);color:var(--cat);height:38px;display:grid;place-items:center}
:root[data-theme="dark"] .tic{--cat:var(--cd)}
.tic svg{width:38px;height:38px;display:block}
.tic svg [stroke-width]{stroke-width:2.6}
.tic .icon{width:30px;height:30px}
.tnm{font:600 13px/16px var(--fb);color:var(--ink);margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.tsub{font:500 10.5px/14px var(--fb);color:var(--muted);margin-top:2px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tby{position:absolute;top:7px;right:7px;width:18px;height:18px;border-radius:50%;background:var(--champagne);color:var(--gold);font:700 10px/18px var(--fb)}
.tile.done{opacity:.5}
.tile.done .tnm{text-decoration:line-through;color:var(--muted)}
.ptile.on{background:color-mix(in srgb,var(--primary) 13%,var(--paper));box-shadow:inset 0 0 0 1.5px var(--primary)}
.ptile .tok{position:absolute;top:7px;left:7px;width:18px;height:18px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center}
.ptile .tdue{position:absolute;top:7px;right:7px;font:700 9.5px/1 var(--fb);color:var(--gold);background:var(--champagne);border-radius:5px;padding:3px 5px}
.pad .tgrid{margin:0}
.donehint{font:400 12px/18px var(--fb);color:var(--muted);padding:8px 20px 0}
/* editar con ratón: lápiz visible al pasar por encima */
.edb{display:none;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ground);color:var(--muted);flex:none}
.edb:hover{color:var(--primary)}
.tile .edb{position:absolute;top:6px;left:6px}
.row .edb{margin-left:8px}
@media (hover:hover){.tile:hover .edb,.row:hover .edb,.prow:hover .edb{display:grid}}
.prow .edb{margin-left:4px}
/* cabecera de pantallas secundarias y buscador */
.hb.back{padding-left:8px;gap:4px}
.hb.back .ib{background:transparent}
.srow2{padding:6px 20px 4px}
.srch{display:flex;align-items:center;gap:10px;height:46px;padding:0 16px;border-radius:999px;background:var(--paper);color:var(--muted);cursor:text}
.srch input{flex:1;min-width:0;border:0;outline:none;background:none;font:500 16px/24px var(--fb, var(--fb));color:var(--ink)}
.srch input::placeholder{color:var(--muted);opacity:1}
.srch:focus-within{box-shadow:inset 0 0 0 1.5px var(--primary)}
.cath.sec2{padding:20px 4px 10px}
.cath.sec2 .tbtn{margin-right:-8px;min-height:32px}
.noq{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:28px 4px}
.noq p{margin:0;font:500 15px/22px var(--fb, var(--fb));color:var(--muted)}
.hb-brand{display:flex;align-items:center;gap:10px}
.hb-brand svg{flex:none;border-radius:9px}
/* preferencias */
.pal{display:flex;gap:14px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;cursor:pointer}
.pal.on{border:2px solid var(--primary);padding:11px}
.pal .pv{width:60px;height:52px;border-radius:8px;border:1px solid var(--line);display:grid;align-content:center;gap:5px;padding:8px;flex:none}
.pal .pv i{display:block;height:6px;border-radius:2px}
.pal b{display:block;font:600 14px/20px var(--fb)}
.pal span{font:400 12px/18px var(--fb);color:var(--muted)}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--on-tint);font:600 16px/1 var(--fb);flex:none}
.acct{display:flex;align-items:center;gap:12px}
.acct + .acct{margin-top:12px}
.acct b{font:600 14px/20px var(--fb);display:block}
.acct span{font:400 12px/18px var(--fb);color:var(--muted)}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.hint-ph{font:400 12px/18px var(--fb);color:var(--muted)}

/* ===== Identidad: capa común ===== */
.ambient,.lh .collage,.empty .collage,.login .art{display:none!important}
.login{padding-top:56px}
.serif,.hb-name,.topbar h1,.big-name,.empty h2,.login h1,.wordmark,.shead h2.serif{font-weight:var(--fhw)!important;letter-spacing:var(--fhls)!important}
.hb-name{font-size:var(--fhs)!important;line-height:1.15!important}

:root[data-theme="dark"] .ptile.on{background:color-mix(in srgb,var(--champagne) 16%,var(--paper))}
</style>

function archive(){
  const today=dayKey(Date.now());
  S.items.forEach(i=>{if(i.checked&&!i.checkedAt)i.checkedAt=Date.now();});
  const old=S.items.filter(i=>i.checked&&dayKey(i.checkedAt)!==today);
  old.forEach(i=>{const k=dayKey(i.checkedAt);let t=S.history.find(h=>h.key===k);if(!t){t={key:k,items:[]};S.history.push(t);}
    t.items.push(i.n);const c=catalogOf(i.n);if(c){c.last=Math.round((Date.now()-i.checkedAt)/864e5);c.count=Math.min(10,c.count+1);}});
  if(old.length){S.items=S.items.filter(i=>!old.includes(i));S.history.sort((a,b)=>b.key.localeCompare(a.key));}
}

const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}

}

function inStore(item,k){ if(!k) return true; if(STORES[k].kind==="super") return item.s===k || item.s===null; return item.s===k; }

const NUMW = {un:1,una:1,uno:1,unos:null,unas:null,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,doce:12,"media docena":6,"una docena":12};
const KW = {
 fruta:["fruta","pera","melon","sandia","uva","kiwi","mango","pina","limon","mandarina","cereza","melocoton","platano"],
 verdura:["zanahoria","ajo","brocoli","espinaca","pepino","berenjena","judia","puerro","champinon","verdura","lechuga","tomate","cebolla","patata"],
 carne:["pollo","ternera","cerdo","cordero","chuleta","filete","hamburguesa","salchicha","costilla","conejo","solomillo"],
 pescado:["pescado","gamba","langostino","bacalao","dorada","lubina","sardina","boqueron","calamar","mejillon","pulpo","salmon","merluza"],
 charcuteria:["queso","chorizo","salchichon","mortadela","fiambre","jamon","pavo"],
 lacteos:["leche","yogur","nata","kefir","huevo","mantequilla"],
 panaderia:["pan","barra","baguette","bolleria","croissant","magdalena","pico"],
 despensa:["arroz","pasta","macarron","espagueti","lenteja","garbanzo","harina","azucar","sal","aceite","vinagre","conserva","tomate frito","especia","cafe","cacao","cereal","atun"],
 congelados:["congelad","helado","pizza"],
 bebidas:["agua","cerveza","vino","refresco","zumo","cola","tonica"],
 dulces:["chocolate","galleta","patatas fritas","snack","chuche","gominola","frutos secos","turron"],
 lucia:["panal","toallita","potito","biberon","chupete","bebe","papilla","leche de continuacion"],
 higiene:["gel","champu","desodorante","cepillo","pasta de dientes","compresa","crema","colonia","maquinilla"],
 limpieza:["lejia","detergente","suavizante","friega","limpia","fregona","estropajo","bayeta","basura","amoniaco","papel higienico","servilleta","papel de cocina","lavavajillas"],
 hogar:["bombilla","pila","vela","enchufe","pegamento","cinta","tupper"]
};
function guessCat(nq){let best="otros",len=0;const t=" "+nq;
  for(const [c,ws] of Object.entries(KW)) for(const w of ws) if(t.includes(" "+w)&&w.length>len){best=c;len=w.length;}
  return best;}
/* Tienda más habitual para una categoría (p. ej. la fruta, en la frutería) */
function catHabit(c){const xs=S.catalog.filter(x=>x.c===c);if(xs.length<2)return null;const cnt={};xs.forEach(x=>{const k=x.s||"_";cnt[k]=(cnt[k]||0)+1});
  const [k,v]=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];return (k!=="_"&&v/xs.length>=.6)?k:null;}
function matchCatalog(q){
  const sq=singAll(q);let best=null,score=9,bestPart=false;
  for(const c of S.catalog){const t=singAll(norm(c.n));let d;
    let part=false;
    if(t===sq)d=0;else if(sq.length>=4&&((" "+t+" ").includes(" "+sq+" ")||(" "+sq+" ").includes(" "+t+" "))){d=.05+Math.abs(t.length-sq.length)/400;part=true;}
    else d=lev(sq,t)/Math.max(sq.length,t.length);
    if(d<score){score=d;best=c;bestPart=part;}}
  if(best&&score<=.26) return {c:best,exact:score===0,partial:bestPart,score};
  return null;
}
function parseOne(raw){
  let t=" "+norm(raw)+" ", store=null, explicit=false, lucia=false, generic=false, qty=null;
  t=t.replace(/ (de|para|del|a) (la|el|mi)? ?(nina|nena|bebe|peque|lucia) /g,()=>{lucia=true;return " ";});
  for(const [k,st] of Object.entries(STORES)) for(const a of st.a){
    const re=new RegExp(" (de|del|en|en el|en la|de la|del la|al|para el)? ?(el |la )?"+a+" ");
    if(re.test(t)){store=k;explicit=true;t=t.replace(re," ");}
  }
  t=t.replace(/ (de|en) cualquier (sitio|super|supermercado|lado) | da igual donde /,()=>{generic=true;explicit=true;return " ";});
  t=t.trim();
  let m=t.match(/^(\d+(?:[.,]\d+)?)\s*(kg|kilos?|g|gr|gramos|l|litros?|ml)?\s+(?:de\s+)?(.+)$/);
  if(m){const u=m[2]?({kg:"kg",kilo:"kg",kilos:"kg",g:"g",gr:"g",gramos:"g",l:"l",litro:"l",litros:"l",ml:"ml"})[m[2]]:null;qty=u?`${m[1]} ${u}`:`×${m[1]}`;t=m[3];}
  else{for(const w of Object.keys(NUMW).sort((a,b)=>b.length-a.length)){if(t.startsWith(w+" ")){const v=NUMW[w];if(v&&v>1)qty="×"+v;t=t.slice(w.length+1).replace(/^de /,"");break;}}}
  t=t.replace(/^(el|la|los|las|algo de|algo|un poco de) /,"").trim();
  if(!t) return null;
  const ow=raw.toLowerCase().replace(/[^\p{L}\p{N} ]/gu," ").split(/\s+/).filter(Boolean), nw=ow.map(norm), tt=t.split(" ");
  let shown=t;for(let k=0;k+tt.length<=nw.length;k++){if(nw.slice(k,k+tt.length).join(" ")===t){shown=ow.slice(k,k+tt.length).join(" ");break;}}
  const hit=matchCatalog(t);
  const e={raw:raw.trim(),q:t,include:true,showAll:false};
  if(hit){const c=hit.c;e.n=c.n;e.c=lucia?"lucia":c.c;e.qty=null;e.known=true;
    e.corrected=(!hit.exact&&!hit.partial)?shown:null;
    e.s=explicit?(generic?null:store):c.s; e.explicit=explicit;
    e.ask=!explicit && c.s ? {s:c.s,why:`Normalmente lo apuntáis en ${STORES[c.s].n}`} : null;
  }else{e.n=cap(shown);e.c=lucia?"lucia":guessCat(t);e.qty=null;e.known=false;e.corrected=null;e.explicit=explicit;
    const h=explicit?null:catHabit(e.c);e.s=explicit?(generic?null:store):h;
    e.ask=h?{s:h,why:`Es nuevo. Lo de ${CAT[e.c].l.toLowerCase()} soléis comprarlo en ${STORES[h].n}`}:null;}
  e.dup=S.items.some(i=>!i.checked&&norm(i.n)===norm(e.n));
  if(e.dup)e.include=false;
  return e;
}
function splitUtterance(text){
  let t=" "+text.replace(/[.;]/g,",")+" ";
  t=t.replace(/\b(me hacen falta|me hace falta|hace falta|hacen falta|necesito|necesitamos|hay que comprar|apunta|apuntame|añade|anade|pon|compra|comprar)\b/gi,",");
  return t.split(/,|\s+y\s+|\s+e\s+|\s+tambien\s+|\s+también\s+/i).map(s=>s.trim()).filter(s=>s.length>1);
}
function parseUtterance(text){return splitUtterance(text).map(parseOne).filter(Boolean);}
/* "He comprado todo lo de Mercadona menos los huevos" */
function parseCommand(text){
  const t=" "+norm(text)+" ";
  if(!/ (he|hemos|ya) (comprado|cogido|pillado|tengo|tenemos)| compra(do|da)s? | ya esta /.test(t) && !/^ (tacha|marca) /.test(t)) return null;
  let store=null;for(const [k,st] of Object.entries(STORES))for(const a of st.a)if(t.includes(" "+a+" "))store=k;
  const pend=S.items.filter(i=>!i.checked);
  let base=pend.filter(i=>inStore(i,store||S.store));
  const [main,exc]=t.split(/ (menos|excepto|salvo|sin) /).filter((_,i)=>i!==1);
  const findIn=(chunk,pool)=>splitUtterance(chunk).map(s=>{const q=singAll(norm(s).replace(/^(el|la|los|las|lo de|lo del) /,""));
      return pool.find(i=>{const n=singAll(norm(i.n));return n===q||(" "+n+" ").includes(" "+q+" ")||lev(q,n)/Math.max(q.length,n.length)<.26;});}).filter(Boolean);
  let targets;
  if(/ todo /.test(main)) targets=base; else targets=findIn(main.replace(/ (he|hemos|ya) (comprado|cogido|pillado|tengo|tenemos) /," "),pend);
  const ex=exc?findIn(exc,targets):[];
  return {store:store||S.store,rows:targets.map(i=>({id:i.id,on:!ex.includes(i),ex:ex.includes(i)})),text};
}

function addEntries(entries){
  const added=[];
  for(const e of entries){ if(!e.include) continue;
    const it={id:uid++,n:e.n,c:e.c,s:e.s,q:e.qty||null,checked:false,by:S.user==="mariluz"?"Mariluz":"Alfonso",fresh:true};
    S.items.push(it);added.push(it);
    let c=catalogOf(e.n);
    if(!c){S.catalog.push({n:e.n,c:e.c,s:e.s,q:e.qty||null,every:14,last:0,count:1});}
    else if(c.s!==e.s){c.s=e.s;}   /* aprende la tienda elegida para la próxima vez */
  }
  setTimeout(()=>{added.forEach(i=>i.fresh=false);render();},1600);
  return added;
}
function finishShop(){
  const rows=S.items.filter(i=>i.checked&&(!S.shopping||inStore(i,S.store)));
  if(!rows.length) return;
  const trip={d:"19 nov 2026",store:S.shopping&&S.store?STORES[S.store].n:"Varias tiendas",items:rows.map(i=>i.n+(i.q?" "+i.q:""))};
  S.history.unshift(trip);
  rows.forEach(i=>{const c=catalogOf(i.n);if(c){c.last=0;c.count=Math.min(10,c.count+1);}});
  const removed=rows.map(i=>({...i}));
  S.items=S.items.filter(i=>!rows.includes(i));
  S.band={msg:`Se ${rows.length===1?"guardó":"guardaron"} ${plural(rows.length,"artículo","artículos")} como una compra.`,acts:[["Deshacer","undoFinish"],["Ver historial","history"]],undo:{removed,trip}};
  save();render();
}
function toast(msg,acts,undo){S.band={msg,acts:acts||[],undo};render();clearTimeout(toast.t);toast.t=setTimeout(()=>{if(S.band&&S.band.msg===msg){S.band=null;render();}},6000);}

/* Voz simulada: transcripción que crece al final de la lista (PartialRow de Usuals) */
let voiceTimer=null;
function startVoice(){
  if(S.capture==="listening") return;
  const cmdMode=!!S.store;
  let phrase;
  if(cmdMode){const pend=visible().filter(i=>!i.checked);
    const sk=S.store||"mercadona"; const egg=pend.find(i=>norm(i.n)==="huevos")||pend[pend.length-1];
    phrase=`He comprado todo lo de ${STORES[sk].n}${egg?` menos ${norm(egg.n)==="huevos"?"los huevos":"el "+egg.n.toLowerCase()}`:""}`;}
  else{phrase=VOICE_ADD[S.voiceIx%VOICE_ADD.length];S.voiceIx++;}
  S.capture="listening";S.partial="";S.band=null;render();
  const words=phrase.split(" ");let i=0;
  voiceTimer=setInterval(()=>{i++;S.partial=words.slice(0,i).join(" ");renderPartial();
    if(i>=words.length){clearInterval(voiceTimer);setTimeout(()=>finishVoice(phrase),650);}},170);
}
function finishVoice(phrase){
  S.capture="idle";S.partial="";
  const cmd=parseCommand(phrase);
  if(cmd&&cmd.rows.length){S.sheet={type:"command",...cmd};}
  else{const entries=parseUtterance(phrase);S.sheet={type:"review",said:phrase,entries,voice:true};}
  render();
}
function submitDraft(){
  const text=S.draft.trim(); if(!text) return;
  const cmd=parseCommand(text);
  if(cmd&&cmd.rows.length){S.draft="";S.capture="idle";S.sheet={type:"command",...cmd};render();return;}
  const entries=parseUtterance(text);
  if(!entries.length) return;
  S.draft="";
  const quiet=entries.every(e=>!e.ask&&!e.corrected&&!e.dup&&(e.known||e.explicit));
  if(quiet){const a=addEntries(entries);S.capture="typing";
    toast(a.length===1?`Añadido: ${a[0].n} · ${storeName(a[0].s)}.`:`Añadidos ${a.length} artículos.`,[["Deshacer","undoAdd"]],{ids:a.map(i=>i.id)});save();}
  else{S.capture="idle";S.sheet={type:"review",said:text,entries,voice:false};render();}
}
function quickAdd(name){
  const c=catalogOf(name);if(!c)return;
  if(S.items.some(i=>!i.checked&&i.n===c.n)){toast(`${c.n} ya está en la lista.`);return;}
  const a=addEntries([{n:c.n,c:c.c,s:c.s,qty:c.q,include:true}]);S.draft="";
  toast(`Añadido: ${c.n} · ${storeName(c.s)}.`,[["Deshacer","undoAdd"]],{ids:a.map(i=>i.id)});save();
}
function dueList(){return S.catalog.filter(c=>c.last>=c.every*0.9&&!S.items.some(i=>!i.checked&&i.n===c.n)).sort((a,b)=>b.last/b.every-a.last/a.every);}

/* --- Hojas --- */
function vSheet(){
  const s=S.sheet;let inner="";
  if(s.type==="review") inner=shReview(s);
  else if(s.type==="command") inner=shCommand(s);
  else if(s.type==="edit") inner=shEdit(s);
  else if(s.type==="stores") inner=shStores();
  else if(s.type==="prefs") inner=shPrefs();
  else if(s.type==="one") inner=shOne(s);
  else if(s.type==="share") inner=shShare();
  else if(s.type==="pedit") inner=shPEdit(s);
  else if(s.type==="sedit") inner=shSEdit(s);
  return `<div class="scrim" data-act="closeSheet"></div><div class="sheet" role="dialog"><div class="handle"></div>${inner}</div>`;
}

let lp=null, lpFired=false, lpXY=null;
root.addEventListener("pointerdown",e=>{
  const v=e.target.closest(".dk-voice,.dk-voice-mini");
  if(v){e.preventDefault();startVoice();return;}
  const pt=e.target.closest(".ptile[data-n],.prow[data-act='ptoggle']");
  if(pt&&!e.target.closest(".edb")){lpFired=false;lpXY=[e.clientX,e.clientY];clearTimeout(lp);lp=setTimeout(()=>{lpFired=true;openPEdit(pt.dataset.n);},480);return;}
  const row=e.target.closest(".row[data-id],.tile[data-id]");
  if(row){lpFired=false;lpXY=[e.clientX,e.clientY];clearTimeout(lp);lp=setTimeout(()=>{lpFired=true;openEdit(+row.dataset.id);},480);}
});
root.addEventListener("pointermove",e=>{if(lpXY&&Math.hypot(e.clientX-lpXY[0],e.clientY-lpXY[1])>8)clearTimeout(lp);});
["pointerup","pointercancel","pointerleave"].forEach(t=>root.addEventListener(t,()=>clearTimeout(lp)));
root.addEventListener("contextmenu",e=>{const pt=e.target.closest(".ptile[data-n],.prow[data-act='ptoggle']");if(pt){e.preventDefault();clearTimeout(lp);lpFired=true;openPEdit(pt.dataset.n);return;}const row=e.target.closest(".row[data-id],.tile[data-id]");if(row){e.preventDefault();clearTimeout(lp);lpFired=true;openEdit(+row.dataset.id);}});
function openEdit(id){const i=S.items.find(x=>x.id===id);if(!i)return;S.sheet={type:"edit",id,draft:{n:i.n,q:i.q,s:i.s,c:i.c}};render();}

root.addEventListener("click",e=>{
  const row=e.target.closest(".row[data-id],.tile[data-id]");
  if(row&&!e.target.closest("[data-act]")){
    if(lpFired){lpFired=false;return;}
    const i=S.items.find(x=>x.id===+row.dataset.id);if(i){i.checked=!i.checked;i.checkedAt=i.checked?Date.now():null;save();
      if(i.checked)toast(`Se ha tachado ${i.n}`,[["Deshacer","undoTick"]],{ids:[i.id]});else render();}return;
  }
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act, k=el.dataset.k;
  const sh=S.sheet;
  switch(a){
    case "login":{const u=norm(root.querySelector("#lu").value),p=root.querySelector("#lp").value;
      if(!["alfonso","mariluz"].includes(u)||!p){S.loginErr=true;render();return;}
      S.user=u;S.auth=true;S.view="list";S.loginErr=false;save();render();scheduleLive();return;}
    case "remember":S.remember=!S.remember;render();return;
    case "menu":S.menu=!S.menu;render();return;
    case "closeMenu":S.menu=false;render();return;
    case "history":S.menu=false;S.band=null;S.view="history";S.histSel={};render();return;
    case "pantry":S.menu=false;S.capture="idle";S.view="pantry";render();return;
    case "back":S.view="list";render();return;
    case "store":S.store=k||null;save();render();return;
    case "startShop":S.menu=false;if(S.store){S.shopping=true;S.capture="idle";}else S.sheet={type:"stores"};render();return;
    case "shopAt":S.store=k||null;S.sheet=null;save();render();return;
    case "stores":S.menu=false;S.sheet={type:"stores"};render();return;
    case "sedit":{const st=STORES[k];S.sheet={type:"sedit",k,draft:{n:st.n,kind:st.kind}};render();return;}
    case "snew":S.sheet={type:"sedit",k:null,draft:{n:"",kind:"shop"}};render();return;
    case "sdKind":sh.draft.n=root.querySelector("#sn").value;sh.draft.kind=k;render();return;
    case "sdMove":{sh.draft.n=root.querySelector("#sn").value;const ks=Object.keys(S.stores),i=ks.indexOf(sh.k),j=i+(+k);if(j<0||j>=ks.length)return;[ks[i],ks[j]]=[ks[j],ks[i]];S.stores=Object.fromEntries(ks.map(x=>[x,S.stores[x]]));save();render();return;}
    case "sdDel":sh.draft.n=root.querySelector("#sn").value;sh.confirm=true;render();return;
    case "sdNo":sh.confirm=false;render();return;
    case "sdDelYes":{const id=sh.k,nm=S.stores[id].n;delete S.stores[id];S.items.forEach(i=>{if(i.s===id)i.s=null;});S.catalog.forEach(c=>{if(c.s===id)c.s=null;});if(S.store===id)S.store=null;
      S.sheet={type:"stores"};save();render();return;}
    case "sdSave":{const nm=cap(root.querySelector("#sn").value.trim());if(!nm){root.querySelector("#sn").focus();return;}
      const clash=Object.entries(S.stores).find(([id,x])=>norm(x.n)===norm(nm)&&id!==sh.k);if(clash){root.querySelector("#sn").focus();return;}
      if(sh.k){const x=S.stores[sh.k];x.n=nm;x.kind=sh.draft.kind;if(x.kind==="shop"&&!x.g)x.g="store";if(!x.a.includes(norm(nm)))x.a.push(norm(nm));}
      else{let id=norm(nm).replace(/[^a-z0-9]+/g,"-")||"tienda",b=id,c=2;while(S.stores[id])id=b+"-"+(c++);S.stores[id]={n:nm,kind:sh.draft.kind,g:sh.draft.kind==="shop"?"store":undefined,a:[norm(nm)]};}
      S.sheet={type:"stores"};save();render();return;}
    case "leaveShop":S.shopping=false;save();render();return;
    case "toggleChecked":S.checkedOpen=!S.checkedOpen;render();return;
    case "edit":openEdit(+el.dataset.id);return;
    case "pedit":openPEdit(el.dataset.n);return;
    case "pnew":openPEdit(null);return;
    case "pnewq":openPEdit(null);S.sheet.draft.n=cap(S.pantryQ.trim());S.pantryQ="";render();return;
    case "pdStore":sh.draft.s=k||null;sh.draft.n=root.querySelector("#pn").value;render();return;
    case "pdCat":sh.draft.c=k;sh.draft.n=root.querySelector("#pn").value;render();return;
    case "pdSave":{const n=cap(root.querySelector("#pn").value.trim()),q=null;if(!n){root.querySelector("#pn").focus();return;}
      const clash=S.catalog.find(c=>norm(c.n)===norm(n)&&c.n!==sh.orig);if(clash){toast(`${clash.n} ya está en la despensa.`);return;}
      if(sh.orig){const c=catalogOf(sh.orig);if(PMAPI[sh.orig]&&!PMAPI[n])PMAPI[n]=PMAPI[sh.orig];
        S.items.forEach(i=>{if(!i.checked&&i.n===sh.orig){i.n=n;i.c=sh.draft.c;if(i.s===c.s)i.s=sh.draft.s;}});
        Object.assign(c,{n,q,s:sh.draft.s,c:sh.draft.c});S.sheet=null;toast(`Guardado: ${n}.`);}
      else{S.catalog.push({n,c:sh.draft.c,s:sh.draft.s,q,every:14,last:0,count:0});S.sheet=null;toast(`${n} añadido a la despensa.`);}
      save();return;}
    case "pdDel":{const ix=S.catalog.findIndex(c=>c.n===sh.orig);const c=S.catalog[ix];S.catalog.splice(ix,1);S.sheet=null;
      toast(`Borrado de la despensa: ${c.n}.`,[["Deshacer","undoPDel"]],{c,ix});save();return;}
    case "undoPDel":{const u=S.band&&S.band.undo;if(u)S.catalog.splice(u.ix,0,u.c);S.band=null;save();render();return;}
    case "layout":S.layout=S.layout==="grid"?"list":"grid";save();render();return;
    case "finish":finishShop();return;
    case "undoFinish":{const u=S.band&&S.band.undo;if(u){S.items.push(...u.removed);S.history=S.history.filter(t=>t!==u.trip);}S.band=null;save();render();return;}
    case "undoAdd":{const u=S.band&&S.band.undo;if(u)S.items=S.items.filter(i=>!u.ids.includes(i.id));S.band=null;save();render();return;}
    case "undoTick":{const u=S.band&&S.band.undo;if(u)S.items.forEach(i=>{if(u.ids.includes(i.id)){i.checked=false;i.checkedAt=null;}});S.band=null;save();render();return;}
    case "closeBand":S.band=null;render();return;
    case "type":S.capture="typing";S.band=null;render();return;
    case "closeDraft":S.capture="idle";render();return;
    case "submit":submitDraft();return;
    case "quick":quickAdd(el.dataset.n);return;
    case "voiceFromDraft":S.capture="idle";startVoice();return;
    case "closeSheet":S.sheet=null;render();return;
    case "eInc":sh.entries[+el.dataset.i].include=!sh.entries[+el.dataset.i].include;render();return;
    case "eStore":{const en=sh.entries[+el.dataset.i];en.s=k||null;render();return;}
    case "eMore":sh.entries[+el.dataset.i].showAll=true;render();return;
    case "eAdd":{const a2=addEntries(sh.entries);S.sheet=null;
      toast(a2.length===1?`Añadido: ${a2[0].n} · ${storeName(a2[0].s)}.`:`Añadidos ${a2.length} artículos a la lista.`,[["Deshacer","undoAdd"]],{ids:a2.map(i=>i.id)});save();return;}
    case "cToggle":sh.rows[+el.dataset.i].on=!sh.rows[+el.dataset.i].on;render();return;
    case "cApply":{let n=0;sh.rows.forEach(r=>{if(r.on){const i=S.items.find(x=>x.id===r.id);if(i){i.checked=true;i.checkedAt=Date.now();n++;}}});S.sheet=null;
      toast(n===1?"Se ha tachado 1 artículo":`Se han tachado ${n} artículos`,[["Deshacer","undoTick"]],{ids:sh.rows.filter(r=>r.on).map(r=>r.id)});save();return;}
    case "edStore":sh.draft.s=k||null;render();return;
    case "edCat":sh.draft.c=k;render();return;
    case "edSave":{const i=S.items.find(x=>x.id===sh.id);const n=root.querySelector("#en").value.trim(),q=null;
      if(i&&n){i.n=n;i.q=q||null;i.s=sh.draft.s;i.c=sh.draft.c;const c=catalogOf(n);if(c){c.s=i.s;c.c=i.c;}else S.catalog.push({n,c:i.c,s:i.s,q:i.q,every:14,last:0,count:1});}
      S.sheet=null;save();render();return;}
    case "edDel":{const i=S.items.find(x=>x.id===sh.id);S.items=S.items.filter(x=>x.id!==sh.id);S.sheet=null;
      toast(`Eliminado: ${i.n}.`,[["Deshacer","undoDel"]],{item:i});save();return;}
    case "undoDel":{const u=S.band&&S.band.undo;if(u)S.items.push(u.item);S.band=null;save();render();return;}
    case "ptoggle":{if(lpFired){lpFired=false;return;}const c=catalogOf(el.dataset.n);const ex=S.items.find(i=>!i.checked&&i.n===c.n);
      if(ex)S.items=S.items.filter(i=>i!==ex);else S.items.push({id:uid++,n:c.n,c:c.c,s:c.s,q:c.q,checked:false,by:"Alfonso",fresh:false});save();render();return;}
    case "review1":{S.menu=false;const q=dueList().slice(0,8);S.sheet={type:"one",queue:q,ix:0,added:0};render();return;}
    case "oneAdd":{const c=sh.queue[sh.ix];S.items.push({id:uid++,n:c.n,c:c.c,s:c.s,q:c.q,checked:false,by:"Alfonso",fresh:true});sh.added++;sh.ix++;save();render();return;}
    case "oneSkip":sh.ix++;render();return;
    case "selTrip":{const t=S.history[+el.dataset.t];t.items.forEach((_,xi)=>S.histSel[el.dataset.t+":"+xi]=true);render();return;}
    case "selItem":S.histSel[k]=!S.histSel[k];render();return;
    case "rebuy":{let n=0;Object.keys(S.histSel).filter(x=>S.histSel[x]).forEach(x=>{const [ti,xi]=x.split(":").map(Number);const raw=S.history[ti].items[xi];
        const c=S.catalog.find(c=>raw.startsWith(c.n));if(c&&!S.items.some(i=>!i.checked&&i.n===c.n)){S.items.push({id:uid++,n:c.n,c:c.c,s:c.s,q:c.q,checked:false,by:"Alfonso",fresh:true});n++;}});
      S.histSel={};S.view="list";toast(n?`${plural(n,"artículo añadido","artículos añadidos")} a la lista.`:"Ya estaba todo en la lista.");save();return;}
    case "share":S.menu=false;S.sheet={type:"share"};render();return;
    case "prefs":S.menu=false;S.sheet={type:"prefs"};render();return;
    case "pal":S.palette=k;save();render();return;
    case "theme":S.theme=k;save();render();return;
    case "bg":S.bg=k;save();render();return;
    case "logout":S.menu=false;S.sheet=null;S.auth=false;S.view="login";save();render();return;
    case "reset":{const keepP={palette:S.palette,theme:S.theme,bg:S.bg};S=freshState();Object.assign(S,keepP,{auth:true,view:"list"});save();render();return;}
  }
});
root.addEventListener("input",e=>{
  if(e.target.id==="draft"){S.draft=e.target.value;const s=root.querySelector("#sug");if(s)s.innerHTML=vSug();const b=root.querySelector('[data-act="submit"]');if(b)b.disabled=!S.draft.trim();}
  if(e.target.id==="hq"){S.histQ=e.target.value;const pos=e.target.selectionStart;render();const i=root.querySelector("#hq");i.focus();i.setSelectionRange(pos,pos);}
  if(e.target.id==="pq"){S.pantryQ=e.target.value;const pos=e.target.selectionStart;render();const i=root.querySelector("#pq");i.focus();i.setSelectionRange(pos,pos);}
});
document.addEventListener("keydown",e=>{
  if(e.target.id==="draft"&&e.key==="Enter"){e.preventDefault();submitDraft();}
  if((e.target.id==="lp"||e.target.id==="lu")&&e.key==="Enter"){e.preventDefault();root.querySelector('button[data-act="login"]').click();}
  if(e.key==="Escape"){S.sheet=null;S.menu=false;if(S.capture==="typing")S.capture="idle";render();}
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>render());
/* En el ordenador, la rueda del ratón desplaza en horizontal la fila de tiendas */
root.addEventListener("wheel",e=>{const c=e.target.closest(".chips");if(c&&Math.abs(e.deltaY)>Math.abs(e.deltaX)){c.scrollLeft+=e.deltaY;e.preventDefault();}},{passive:false});

/* Sincronización simulada: Mariluz añade algo desde su móvil */
let liveT=null,demo=false;
function scheduleLive(){if(S.liveDone||demo)return;clearTimeout(liveT);liveT=setTimeout(()=>{
  if(!S.auth||demo)return;S.liveDone=true;
  const it={id:uid++,n:"Yogur griego",c:"lacteos",s:"mercadona",q:null,checked:false,by:"Mariluz",fresh:true};S.items.push(it);
  if(S.view==="list"&&!S.sheet)toast("Mariluz ha añadido Yogur griego.",[["Deshacer","undoAdd"]],{ids:[it.id]});
  setTimeout(()=>{it.fresh=false;render();},2500);save();render();},14000);}

/* ¿Dispositivo real con zona segura? Entonces se ocultan la barra de estado y el indicador simulados */
(function(){const p=document.createElement("div");p.style.cssText="position:fixed;top:0;height:env(safe-area-inset-top);";document.body.appendChild(p);
  if(p.offsetHeight>0)document.documentElement.classList.add("real-device");p.remove();})();

/* Estados de demostración (capturas): window.__demo("review") */
window.__demo=function(name,opts={}){
  demo=true;clearTimeout(liveT);S=freshState();S.auth=name!=="login";S.view="list";
  if(opts.theme)S.theme=opts.theme;if(opts.palette)S.palette=opts.palette;if(opts.layout)S.layout=opts.layout;
  const by=n=>S.items.find(i=>i.n===n);
  switch(name){
    case "filter":S.store="mercadona";break;
    case "typing":S.capture="typing";S.draft="pa";break;
    case "listening":S.capture="listening";S.partial="Me hace falta leche, pechuga de pollo de la carnicería, pañales para";break;
    case "review":S.sheet={type:"review",said:VOICE_ADD[0],entries:parseUtterance(VOICE_ADD[0]),voice:true};break;
    case "typo":S.sheet={type:"review",said:"cebolas",entries:parseUtterance("cebolas"),voice:false};break;
    case "shopping":S.store="mercadona";S.shopping=true;["Papel higiénico","Jamón serrano"].forEach(n=>by(n).checked=true);break;
    case "command":S.store="mercadona";S.sheet={type:"command",...parseCommand("He comprado todo lo de Mercadona menos los huevos")};break;
    case "finished":{S.store="mercadona";S.shopping=true;["Papel higiénico","Jamón serrano","Lavavajillas","Yogur natural"].forEach(n=>by(n).checked=true);finishShop();break;}
    case "checked":["Plátanos","Pan de masa madre","Huevos"].forEach(n=>{by(n).checked=true;by(n).checkedAt=Date.now();});S.checkedOpen=true;break;
    case "pantry":S.view="pantry";break;
    case "history":S.view="history";S.histSel={"1:0":true,"1:2":true};break;
    case "one":S.sheet={type:"one",queue:dueList().slice(0,8),ix:0,added:0};break;
    case "edit":{const i=by("Alitas de pollo");S.sheet={type:"edit",id:i.id,draft:{n:i.n,q:i.q,s:i.s,c:i.c}};break;}
    case "stores":S.sheet={type:"stores"};break;
    case "prefs":S.sheet={type:"prefs"};break;
    case "menu":S.menu=true;break;
    case "share":S.sheet={type:"share"};break;
  }
  render.v=null;render();
  if(name==="listening"){const l=root.querySelector(".list");if(l)l.scrollTop=l.scrollHeight;}
};

load();
if(S.auth&&!S.remember){S.auth=false;S.view="login";}
render();
if(S.auth)scheduleLive();
</script>
</body>
</html>
